$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
type: pipeline

compute: azureml:cpu-cluster

inputs:
  sampled_data:
    type: uri_folder
    path: azureml:amazon_electronics_features_v1_sampled@latest

jobs:
  split:
    type: command
    component: ../components/split_dataset/component.yml
    inputs:
      data: ${{parent.inputs.sampled_data}}

  normalize_train:
    type: command
    component: azureml:normalize_text@latest
    inputs:
      data: ${{parent.jobs.split.outputs.train}}

  normalize_val:
    type: command
    component: azureml:normalize_text@latest
    inputs:
      data: ${{parent.jobs.split.outputs.val}}

  normalize_test:
    type: command
    component: azureml:normalize_text@latest
    inputs:
      data: ${{parent.jobs.split.outputs.test}}

  normalize_deploy:
    type: command
    component: azureml:normalize_text@latest
    inputs:
      data: ${{parent.jobs.split.outputs.deploy}}

  length_train:
    type: command
    component: azureml:review_length_features@latest
    inputs:
      data: ${{parent.jobs.normalize_train.outputs.out}}

  length_val:
    type: command
    component: azureml:review_length_features@latest
    inputs:
      data: ${{parent.jobs.normalize_val.outputs.out}}

  length_test:
    type: command
    component: azureml:review_length_features@latest
    inputs:
      data: ${{parent.jobs.normalize_test.outputs.out}}

  length_deploy:
    type: command
    component: azureml:review_length_features@latest
    inputs:
      data: ${{parent.jobs.normalize_deploy.outputs.out}}

  sentiment_train:
    type: command
    component: ../components/sentiment_features/component.yml
    inputs:
      data: ${{parent.jobs.normalize_train.outputs.out}}

  sentiment_val:
    type: command
    component: ../components/sentiment_features/component.yml
    inputs:
      data: ${{parent.jobs.normalize_val.outputs.out}}

  sentiment_test:
    type: command
    component: ../components/sentiment_features/component.yml
    inputs:
      data: ${{parent.jobs.normalize_test.outputs.out}}

  sentiment_deploy:
    type: command
    component: ../components/sentiment_features/component.yml
    inputs:
      data: ${{parent.jobs.normalize_deploy.outputs.out}}

  tfidf:
    type: command
    component: ../components/tfidf_features/component.yml
    inputs:
      train: ${{parent.jobs.normalize_train.outputs.out}}
      val: ${{parent.jobs.normalize_val.outputs.out}}
      test: ${{parent.jobs.normalize_test.outputs.out}}
      deploy: ${{parent.jobs.normalize_deploy.outputs.out}}

  sbert_train:
    type: command
    component: azureml:semantic_embeddings@latest
    inputs:
      data: ${{parent.jobs.normalize_train.outputs.out}}

  sbert_val:
    type: command
    component: azureml:semantic_embeddings@latest
    inputs:
      data: ${{parent.jobs.normalize_val.outputs.out}}

  sbert_test:
    type: command
    component: azureml:semantic_embeddings@latest
    inputs:
      data: ${{parent.jobs.normalize_test.outputs.out}}

  sbert_deploy:
    type: command
    component: azureml:semantic_embeddings@latest
    inputs:
      data: ${{parent.jobs.normalize_deploy.outputs.out}}

  merge_train:
    type: command
    component: ../components/merge_features/component.yml
    inputs:
      length: ${{parent.jobs.length_train.outputs.out}}
      sentiment: ${{parent.jobs.sentiment_train.outputs.out}}
      tfidf: ${{parent.jobs.tfidf.outputs.train_out}}
      embeddings: ${{parent.jobs.sbert_train.outputs.out}}

  merge_val:
    type: command
    component: ../components/merge_features/component.yml
    inputs:
      length: ${{parent.jobs.length_val.outputs.out}}
      sentiment: ${{parent.jobs.sentiment_val.outputs.out}}
      tfidf: ${{parent.jobs.tfidf.outputs.val_out}}
      embeddings: ${{parent.jobs.sbert_val.outputs.out}}

  merge_test:
    type: command
    component: ../components/merge_features/component.yml
    inputs:
      length: ${{parent.jobs.length_test.outputs.out}}
      sentiment: ${{parent.jobs.sentiment_test.outputs.out}}
      tfidf: ${{parent.jobs.tfidf.outputs.test_out}}
      embeddings: ${{parent.jobs.sbert_test.outputs.out}}

  merge_deploy:
    type: command
    component: ../components/merge_features/component.yml
    inputs:
      length: ${{parent.jobs.length_deploy.outputs.out}}
      sentiment: ${{parent.jobs.sentiment_deploy.outputs.out}}
      tfidf: ${{parent.jobs.tfidf.outputs.deploy_out}}
      embeddings: ${{parent.jobs.sbert_deploy.outputs.out}}